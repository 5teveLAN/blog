        <h1>考研準備進度</h1>

        

        <p>離散數學第一章，沒了。其他科底子不好，當時不認真，計組計節連上都沒上過。</p>
<p>大四別人都是修9學分，我選到16（實際18 + 專題！)。光是應付課業就佔滿了整個時間，哪來時間準備考研。</p>
<p>多兩學分是去旁聽想聽的課。而且我又會是那種想要認真上課的人，不可能上課的時候讀自己書，下課也要認真做作業。</p>
<p>只能說我以前太不認真，沒有努力去挖掘學校的課。以為課選少就會去有興趣的事，結果沒有。正所謂：「生於憂患，死於安樂。」吧。</p>
<p>我自知能力不足，以前也花不夠多心思學習。我只能先知道自己等級在哪，然後面對問題，慢慢向前。</p>

    </article>
