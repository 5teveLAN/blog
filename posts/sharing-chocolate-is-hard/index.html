        <h1>分享巧克力有點難</h1>

        

        <p>我想去班會課和幾個比較認識的人分享巧克力，因為：</p>
<ul>
<li>覺得不錯吃與家裡很多包</li>
<li>想到以前也被同學分享幾次食物</li>
<li>想 be nice</li>
</ul>
<p>但是到了現場：</p>
<ul>
<li>有些三五成群坐在一起</li>
<li>大家各聊各的，也有人低頭打手遊</li>
<li>還有學霸再弄研究</li>
</ul>
<p>我覺得壓力又夠大，我又和他們不熟，我是系邊。又伴隨著許多焦慮，什麼自己不夠強、成績不夠好、別人都在弄推甄和研究什麼的。沒心情了。</p>
<blockquote>
<p>不過不認識班上同學好像也正常？</p>
</blockquote>
<p>我後來丟銘傳一週的辦公室了，順便給老師吃。（終於找到人分享TAT)</p>
