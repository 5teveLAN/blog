        <h1>昂貴的藍芽耳機是智商稅</h1>

        

        <p>純抱怨，世界上怎麼會有那麼智障的產品。</p>
<ol>
<li>花了大錢買一萬多塊的藍芽耳機，結果電池沒用幾年就報廢。</li>
<li>官方不提供原廠電池，只能去某寶買來路不明的電池。</li>
<li>不敢把來路不明的電池戴在頭上。</li>
</ol>
<p>我花了一整天在網路上找電池、更換評價，發現根本沒靠譜的廠商，換電池也不流行（根本沒人在幫耳機換電池、都是壞了就丟）。索性放棄。</p>
<p>這些廠商大可以好好設計一個通用的電池，在每一款耳機上通用。但是他們就是不肯。</p>
<p>藍芽耳機就是計劃性報廢的爛產品，請選擇耐用的有線耳機，不然就用喇叭。</p>
