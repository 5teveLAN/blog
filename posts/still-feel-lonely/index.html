        <h1>還是會孤單</h1>

        

        <p>我讀比較爛的大學，每天都覺得受夠了。</p>
<p>儘管我現在都泡在圖書館精進自我，每天總還是要在學校走動，走在路上就會看到很多猴子，更不用說他們騎多麼奇怪的機車了。</p>
<p>然後到圖書館又會有看到很多人躺在沙發上睡覺，感覺很不好。</p>
<p>我覺得很孤單，都沒有找到戰友，一個在學校少見的正常人，一起並肩作戰。</p>
<p>我是很容易分心的人，我想靠和實際的人討論東西，轉移掉對不好情緒的注意力。</p>

    </article>
