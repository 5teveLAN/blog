        <h1>我的調色步驟</h1>

        

        <p><strong>統一每張照片</strong></p>
<ol>
<li>調整<strong>曝光</strong>、<strong>等化器</strong>
<ul>
<li>將螢幕調成黑白，專注於光影</li>
<li>確保每張相片亮度差不多</li>
</ul>
</li>
<li><strong>裁切</strong></li>
<li>修正<strong>白平衡</strong>（或<strong>色彩校正</strong>）
<ul>
<li>螢幕調回彩色</li>
</ul>
</li>
<li><strong>色彩等化器</strong>
<ul>
<li>美化膚色</li>
<li>去掉突兀色彩或燈光</li>
<li>如果會影響到別的地方，建立遮罩</li>
</ul>
</li>
</ol>
<p>依不同場景分類調整<br>
5. 主要是 <strong>色彩等化器</strong></p>
